name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Checks only: the job never needs to write to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # node:sqlite (the worker tests' D1 shim) is unflagged from Node 22.13.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:web
      - name: Worker bundles
        working-directory: apps/worker
        run: npx wrangler deploy --dry-run --env="" --outdir .wrangler/dry-run
      - run: npm audit --audit-level=high --omit=dev
