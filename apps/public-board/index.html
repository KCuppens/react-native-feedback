<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Feedback board</title>
    <meta name="description" content="Share ideas, vote on what should be built next, and follow the roadmap." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Feedback board" />
    <meta property="og:description" content="Share ideas, vote on what should be built next, and follow the roadmap." />
    <meta name="twitter:card" content="summary" />
    <style>
      :root { color-scheme: light dark; --muted: #52525b; }
      html, body, #root { height: 100%; margin: 0; }
      /* Zero specificity, so a project's appearance CSS can restyle the page frame too. */
      :where(.fb-page) { max-width: 820px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }
      :where(.fb-page-header) { display: flex; flex-direction: column; gap: 12px; padding: 20px 16px 8px; }
      :where(.fb-page-logo) { display: block; max-width: 160px; height: auto; }
      :where(.fb-page-title) { margin: 0; font: 700 22px var(--fb-font-heading); }
      body { background: #f7f7f8; }
      :root[data-color-scheme='light'] { color-scheme: light; }
      :root[data-color-scheme='dark'] { color-scheme: dark; --muted: #a1a1aa; }
      :root[data-color-scheme='dark'] body { background: #0e0e11; }
      @media (prefers-color-scheme: dark) { :root:not([data-color-scheme='light']) { --muted: #a1a1aa; } :root:not([data-color-scheme='light']) body { background: #0e0e11; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
